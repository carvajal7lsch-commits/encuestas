name: Integración Continua (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend CI (Node.js + TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar dependencias
        run: |
          cd backend
          npm ci

      - name: Validar tipos y compilación
        run: |
          cd backend
          npm run build

      - name: Ejecutar pruebas unitarias
        run: |
          cd backend
          npm run test

  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias
        run: |
          cd frontend
          npm ci

      - name: Ejecutar Análisis Estático (Linter)
        run: |
          cd frontend
          npm run lint

      - name: Validar tipos y compilación
        run: |
          cd frontend
          npm run build

      - name: Ejecutar pruebas unitarias
        run: |
          cd frontend
          npm run test
