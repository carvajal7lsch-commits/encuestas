server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Manifiesto de versión de la app móvil. Nunca se cachea: es justo lo que
    # consultan los celulares para enterarse de que hay una versión nueva, así
    # que una copia vieja retrasaría la actualización de toda la flota.
    location = /app-version.json {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        default_type application/json;
    }

    # APK de la app. El tipo MIME correcto hace que Android lo trate como
    # instalable en vez de como un archivo genérico.
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
